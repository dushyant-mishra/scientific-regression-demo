# Temporary trusted-branch snapshot job. REMOVE before merging into main.
name: Temporary editorial graphic asset snapshot
on:
  push:
    branches:
      - publication/editorial-graphics-data-derived-20261027
    paths:
      - .github/workflows/temporary-editorial-asset-snapshot.yml
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/publication/editorial-graphics-data-derived-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the optional figure renderer
        run: python -m pip install -r requirements-editorial.txt
      - name: Generate diagrams from committed data and test receipts
        run: python make_editorial_figures.py
      - name: Commit eight source-derived final image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/editorial_01_rna_evidence_landscape_v1.png figures/editorial_01_rna_evidence_landscape_v1.svg
          git add figures/editorial_01_rna_evidence_mobile_v1.png figures/editorial_01_rna_evidence_mobile_v1.svg
          git add figures/editorial_02_test_tripwire_landscape_v1.png figures/editorial_02_test_tripwire_landscape_v1.svg
          git add figures/editorial_02_test_tripwire_mobile_v1.png figures/editorial_02_test_tripwire_mobile_v1.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Visuals: snapshot data-derived desktop and mobile assets'
          git push origin HEAD:publication/editorial-graphics-data-derived-20261027
