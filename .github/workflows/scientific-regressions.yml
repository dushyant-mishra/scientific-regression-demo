name: RNA scientific regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact repository revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional editorial figure renderer
        run: python -m pip install -r requirements-editorial.txt
      - name: Regenerate editorial figures from audited data and test receipts
        run: python make_editorial_figures.py
      - name: Run beginner examples
        run: python try_examples.py
      - name: Rebuild and inspect RNA example
        run: |
          python generate_fictional_data.py
          python analyze_fictional_rna.py
      - name: Run all regression and reporting tests
        run: python -m pytest -q
      - name: Validate historical audit custody
        run: python scripts/validate_lane_audit.py
      - name: Reproduce deliberate RED and repaired GREEN runs
        run: python run_demo.py
      - name: Rebuild figures from actual output files
        run: python make_figures.py
      - name: Preserve reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fictional-rna-regression-receipts
          path: |
            outputs/
            figures/
          if-no-files-found: warn
