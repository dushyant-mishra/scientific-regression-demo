name: Temporary export historical agent handoff out of reader repository
on:
  push:
    branches:
      - docs/analysis-first-reader-entrypoint-20261027
    paths:
      - .github/workflows/temporary-export-internal-handoff.yml
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/docs/analysis-first-reader-entrypoint-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: archived-internal-agent-handoff
          path: docs/handoff/
          if-no-files-found: error
