# TEMPORARY: remove this workflow once the regenerated PNG/SVG have been committed.
# This trusted branch-only job writes just the two versioned figure assets.
name: Temporary source-verified donor-figure snapshot
on:
  push:
    branches:
      - publication/beginner-hands-on-and-donor-figure-20261027
    paths:
      - .github/workflows/temporary-render-publication-figure.yml
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/publication/beginner-hands-on-and-donor-figure-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install plotting tools
        run: python -m pip install -r requirements.txt
      - name: Rebuild all figures from their canonical sources
        run: python make_figures.py
      - name: Snapshot only the new donor PNG and SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/figure_4_donor_units_v3.png figures/figure_4_donor_units_v3.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Figures: snapshot donor-ID plot from source generator'
          git push origin HEAD:publication/beginner-hands-on-and-donor-figure-20261027
