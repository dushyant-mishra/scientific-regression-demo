# TEMPORARY branch-only export, remove before PR.
name: Temporary off-repository Medium writing export
on:
  push:
    branches:
      - docs/analysis-first-reader-entrypoint-20261027
    paths:
      - .github/workflows/temporary-export-medium-kit.yml
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/docs/analysis-first-reader-entrypoint-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current Medium writing package (no changes to source)
        uses: actions/upload-artifact@v4
        with:
          name: off-repository-medium-writing-package
          path: |
            MEDIUM_ARTICLE.md
            docs/publication/
            make_editorial_figures.py
            requirements-editorial.txt
            figures/editorial_*.png
            figures/editorial_*.svg
          if-no-files-found: error
