<svg baseProfile="full" height="1700px" version="1.1" viewBox="0 0 900 1700" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Mobile: a measured gene is not an unassayed gene</title><desc>Study A cell_01 gene_3 has positive count; Study B cell_07 gene_3 was not assayed; gene_2 is a separate measured zero.</desc><defs /><rect fill="#F7F8FC" height="1700" rx="0" ry="0" stroke="none" stroke-width="0" width="900" x="0" y="0" /><rect fill="#EAE6FC" height="62" rx="31.0" ry="31.0" stroke="none" stroke-width="0" width="381" x="50" y="48" /><text fill="#6449B8" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="240.5" y="88.86">THE SCIENTIFIC MIX-UP</text><text fill="#17253B" font-family="DejaVu Sans" font-size="76" font-weight="bold" text-anchor="start" x="50" y="196">Same gene.</text><text fill="#17253B" font-family="DejaVu Sans" font-size="70" font-weight="bold" text-anchor="start" x="50" y="281">Different evidence.</text><text fill="#44536A" font-family="DejaVu Sans" font-size="34" font-weight="normal" text-anchor="start" x="50" y="348">A missing assay is not a zero.</text><rect fill="#FFFFFF" height="374" rx="28" ry="28" stroke="#D7E1EC" stroke-width="2" width="800" x="50" y="397" /><rect fill="#E8F9F3" height="91" rx="21" ry="21" stroke="none" stroke-width="0" width="755" x="72" y="417" /><text fill="#087368" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="100" y="477">STUDY A · cell_01</text><text fill="#17253B" font-family="DejaVu Sans" font-size="41" font-weight="bold" text-anchor="start" x="94" y="567">gene_3: assayed</text><text fill="#44536A" font-family="DejaVu Sans" font-size="29" font-weight="normal" text-anchor="start" x="94" y="633">RNA count</text><text fill="#087368" font-family="DejaVu Sans" font-size="109" font-weight="bold" text-anchor="start" x="95" y="730">4</text><circle cx="704" cy="654" fill="#FFFFFF" r="68" stroke="#087368" stroke-width="5" /><circle cx="679" cy="629" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="728" cy="632" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="684" cy="676" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="728" cy="677" fill="#087368" r="8" stroke="none" stroke-width="0" /><rect fill="#FFFFFF" height="374" rx="28" ry="28" stroke="#D7E1EC" stroke-width="2" width="800" x="50" y="801" /><rect fill="#FFF1D1" height="91" rx="21" ry="21" stroke="none" stroke-width="0" width="755" x="72" y="821" /><text fill="#925806" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="100" y="881">STUDY B · cell_07</text><text fill="#17253B" font-family="DejaVu Sans" font-size="41" font-weight="bold" text-anchor="start" x="94" y="971">gene_3: NOT assayed</text><text fill="#44536A" font-family="DejaVu Sans" font-size="29" font-weight="normal" text-anchor="start" x="94" y="1037">RNA count</text><text fill="#925806" font-family="DejaVu Sans" font-size="109" font-weight="bold" text-anchor="start" x="95" y="1134">—</text><circle cx="704" cy="1058" fill="#FFFFFF" r="68" stroke="#925806" stroke-width="5" /><line stroke="#925806" stroke-linecap="round" stroke-width="8" x1="665" x2="743" y1="1097" y2="1019" /><rect fill="#EAE6FC" height="212" rx="24" ry="24" stroke="none" stroke-width="0" width="800" x="50" y="1232" /><text fill="#17253B" font-family="DejaVu Sans" font-size="37" font-weight="bold" text-anchor="start" x="84" y="1308">A real measured zero:</text><text fill="#6449B8" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" x="84" y="1378">gene_2 · Study A · cell_01 · count 0</text><rect fill="#243553" height="135" rx="24" ry="24" stroke="none" stroke-width="0" width="800" x="50" y="1490" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="82" y="1548">The scientific rule</tex