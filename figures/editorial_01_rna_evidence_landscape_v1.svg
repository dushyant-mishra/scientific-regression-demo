<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1010px" version="1.1" viewBox="0 0 1600 1010" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Same gene, different RNA evidence</title><desc>Fictional RNA table: Study A cell_01 gene_3 count 4, Study B cell_07 gene_3 not assayed, and separately Study A cell_01 gene_2 measured zero.</desc><defs /><rect fill="#F7F8FC" height="1010" rx="0" ry="0" stroke="none" stroke-width="0" width="1600" x="0" y="0" /><rect fill="#EAE6FC" height="49" rx="24.5" ry="24.5" stroke="none" stroke-width="0" width="250" x="68" y="60" /><text fill="#6449B8" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="middle" x="193.0" y="91.3">THE SCIENTIFIC MIX-UP</text><text fill="#17253B" font-family="DejaVu Sans" font-size="65" font-weight="bold" text-anchor="start" x="70" y="188">Same gene. Different evidence.</text><text fill="#44536A" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="72" y="240">Study B did not assay gene_3. A blank must not become zero.</text><rect fill="#FFFFFF" height="424" rx="28" ry="28" stroke="#D7E1EC" stroke-width="2" width="715" x="70" y="292" /><rect fill="#E8F9F3" height="88" rx="20" ry="20" stroke="none" stroke-width="0" width="679" x="88" y="310" /><text fill="#087368" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="113" y="364">STUDY A  ·  cell_01</text><text fill="#17253B" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" x="113" y="449">gene_3 was assayed</text><text fill="#44536A" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="113" y="503">RNA count</text><text fill="#087368" font-family="DejaVu Sans" font-size="112" font-weight="bold" text-anchor="start" x="113" y="628">4</text><circle cx="641" cy="550" fill="#FFFFFF" r="68" stroke="#087368" stroke-width="5" /><circle cx="616" cy="525" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="665" cy="528" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="621" cy="572" fill="#087368" r="8" stroke="none" stroke-width="0" /><circle cx="665" cy="573" fill="#087368" r="8" stroke="none" stroke-width="0" /><text fill="#17253B" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="113" y="686">Measured RNA</text><rect fill="#FFFFFF" height="424" rx="28" ry="28" stroke="#D7E1EC" stroke-width="2" width="715" x="815" y="292" /><rect fill="#FFF1D1" height="88" rx="20" ry="20" stroke="none" stroke-width="0" width="679" x="833" y="310" /><text fill="#925806" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="858" y="364">STUDY B  ·  cell_07</text><text fill="#17253B" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" x="858" y="449">gene_3 was not assayed</text><text fill="#44536A" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="858" y="503">RNA count</text><text fill="#925806" font-family="DejaVu Sans" font-size="112" font-weight="bold" text-anchor="start" x="858" y="628">—</text><circle cx="1386" cy="550" fill="#FFFFFF" r="68" stroke="#925806" stroke-width="5" /><line stroke="#925806" stroke-linecap="round" stroke-width="8" x1="1347" x2="1425" y1="589" y2="511" /><text fill="#17253B" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="858" y="686">No observation exists</text><rect fill="#EAE6FC" height="115" rx="22" ry="22" stroke="none" stroke-width="0" width="1460" x="70" y="750" /><rect fill="#FFFFFF" height="50" rx="25.0" ry="25.0" stroke="none" stroke-width="0" width="279" x="100" y="781" /><text fill="#6449B8" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" x="239.5" y="813.82">DIFFERENT GENE</text><text fill="#17253B" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="409" y="815">gene_2  ·  Study A  ·  cell_01  ·  assayed count 0</text><text fill="#44536A" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="100" y="848">This is a measured zero. It is NOT equivalent to the unassayed gene above.</text><rect fill="#243553" height="63" rx="16" ry="16" stroke="none" stroke-width="0" width="1460" x="70" y="901" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="96" y="943">THE RULE: Check whether the assay happened before interpreting its count.</text></svg>